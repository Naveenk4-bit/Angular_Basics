<!--  appHighlight is a custome directive -->
<h4>Hover over each box below to see the highlight effect </h4>
<div class="box">
    <p [appHighlight] = "'green'"></p>
    <p [appHighlight] = "'red'"></p>
    <p [appHighlight] = "'blue'"></p>
    <p [appHighlight] = "'pink'"></p>
    <p [appHighlight] = "'yellow'"></p>
    <p [appHighlight] = "'orange'"></p>
</div>
