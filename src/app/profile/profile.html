<div class="form">
  <h4>User Profile Editor App</h4>

  <div class="form-group">
    <label>First Name</label>
    <input type="text" [(ngModel)]="fname">
  </div>

  <div class="form-group">
    <label>Last Name</label>
    <input type="text" [(ngModel)]="lname">
  </div>

  <div class="form-group">
    <label>Age</label>
    <input type="number" [(ngModel)]="age">
  </div>

  <div class="form-group">
    <label>D.O.B</label>
    <input type="date" [(ngModel)]="dob">
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" [(ngModel)]="email">
  </div>

  <div class="form-group">
    <label>Phone</label>
    <input type="tel" [(ngModel)]="phone">
  </div>

</div>
<div class="result">
      <h5>_____Your Details_____</h5>
<p> First Name: {{fname}}</p>
<p> Last Name: {{lname}}</p>
<p> Age: {{age}}</p>
<p> D.O.B: {{dob}}</p>
<p> Email: {{email}}</p>
<p> Phone: {{phone}}</p>
</div>
